      <p class="eyebrow">FACTORY OPERATIONS</p>
      <h1>Governed Floor</h1>
      <p class="subtitle">One governed flow for every machine, every vendor</p>
    </div>
    <nav class="view-nav" aria-label="Application views">
      <a href="/machine">Machine</a>
      <a class="active" href="/operations">Factory operations</a>

  <main class="operations-layout">
    <aside class="panel incident-queue">
      <div class="panel-header">

        <p class="muted">Start a guided scenario from Demo control.</p>
