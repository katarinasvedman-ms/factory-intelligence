application:
  default_target: device
  allow_fallback: false
  fallback_order: [edge, device]
  log_prompt_content: false
  request_timeout_seconds: 180

providers:
  device:
    enabled: true
    type: openai_compatible
    target_type: device
    endpoint_alias: foundry-local-device
    base_url_env: DEVICE_BASE_URL
    model_env: DEVICE_MODEL
    base_url: http://127.0.0.1:49195
    model: qwen2.5-0.5b-instruct-openvino-gpu:2
    auth_mode: none
    chat_path: /v1/chat/completions
    health_path: /v1/models
    capabilities:
      disconnected_inference: true

  edge:
    enabled: true
    type: agentic_retrieval
    target_type: edge
    endpoint_alias: arc-agentic-factory-edge
    base_url_env: EDGE_AGENTIC_BASE_URL
    api_key_env: EDGE_AGENTIC_TOKEN
    agent_id_env: EDGE_AGENT_ID
    auth_mode: bearer
    health_path: /knowledge-bases?limit=1
    agent_poll_interval_ms: 750
    capabilities:
      tool_calling: true
      disconnected_inference: true
      shared_endpoint: true
      local_evaluation: true
      model_management: true

  cloud:
    enabled: false
    type: openai_compatible
    target_type: cloud
    endpoint_alias: approved-cloud
    base_url_env: CLOUD_BASE_URL
    api_key_env: CLOUD_API_KEY
    model_env: CLOUD_MODEL
    auth_mode: api_key
    auth_header: api-key
    chat_path: /v1/chat/completions
    health_path: /v1/models
    capabilities:
      shared_endpoint: true

  mock-device:
    enabled: false
    type: mock
    target_type: device
    endpoint_alias: simulated-device
    model: mock-device-model-v1

  mock-edge:
    enabled: false
    type: mock
    target_type: edge
    endpoint_alias: simulated-edge
    model: mock-edge-model-v1

  mock-cloud:
    enabled: false
    type: mock
    target_type: cloud
    endpoint_alias: simulated-cloud
    model: mock-cloud-model-v1
