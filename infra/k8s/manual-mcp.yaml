apiVersion: v1
kind: Namespace
metadata:
  name: factory-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-manual-mcp
  namespace: factory-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: factory-manual-mcp
  template:
    metadata:
      labels:
        app: factory-manual-mcp
    spec:
      nodeSelector:
        workload: factory-cpu
      containers:
        - name: mcp
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TENANT_ID
              value: "__TENANT_ID__"
            - name: AUDIENCE
              value: "__AUDIENCE__"
            - name: MCP_PUBLIC_URL
              value: "https://__MCP_DOMAIN__"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: factory-manual-mcp
  namespace: factory-mcp
spec:
  selector:
    app: factory-manual-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: factory-manual-mcp
  namespace: factory-mcp
spec:
  secretName: factory-manual-mcp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "__MCP_DOMAIN__"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: factory-manual-mcp
  namespace: factory-mcp
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: manual-mcp-nginx
  tls:
    - hosts:
        - "__MCP_DOMAIN__"
      secretName: factory-manual-mcp-tls
  rules:
    - host: "__MCP_DOMAIN__"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: factory-manual-mcp
                port:
                  name: http
